<html lang="en">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRA – Find Deals Near You</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="hra.css">
  <script src="stores.js"></script>
  <style>
    :root {
      --navy:      #012e71;
      --blue:      #008ed0;
      --gold:      #ffc631;
      --step-blue: #5bc8f5;
      --gray:      #cfcecb;
      --bg:        #f8f9fd;
      --fs-xs:   clamp(10px, 1.2vw + 8px,  12px);
      --fs-sm:   clamp(11px, 1.4vw + 9px,  13px);
      --fs-base: clamp(13px, 1.6vw + 10px, 15px);
      --fs-md:   clamp(14px, 2vw  + 10px,  17px);
      --fs-lg:   clamp(16px, 2.5vw + 11px, 20px);
      --fs-xl:   clamp(18px, 3vw  + 12px,  26px);
      --fs-2xl:  clamp(22px, 4vw  + 14px,  34px);
    }

    .location-card h1 { font-size: var(--fs-2xl) !important; }
    .location-card p  { font-size: var(--fs-base) !important; }
    .zip-form input   { font-size: var(--fs-lg) !important; }
    .zip-form .btn-go { font-size: var(--fs-base) !important; }

    html, body { height: 100%; }

    .location-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    /* ── Location card ── */
    .location-card {
      background: var(--navy);
      border-radius: 24px;
      padding: 36px 24px 28px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(1,46,113,.3);
    }

    .location-card::before {
      content: '';
      position: absolute;
      top: -50px; right: -50px;
      width: 150px; height: 150px;
      background: rgba(255,255,255,.05);
      border-radius: 50%;
      filter: blur(20px);
      pointer-events: none;
    }

    /* ── Pin icon wrap ── */
    .pin-wrap {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(255,255,255,.10);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    /* ── Pill input ── */
    .zip-form {
      background: #fff;
      border-radius: 50px;
      display: flex;
      align-items: center;
      height: 52px;
      padding: 5px 5px 5px 20px;
      width: 100%;
      max-width: 340px;
      margin: 0 auto 20px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,.06);
      transition: transform .2s;
    }
    .zip-form:focus-within { transform: scale(1.02); }

    .zip-form input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 16px;
      font-weight: 700;
      color: var(--navy);
      min-width: 0;
      font-family: inherit;
    }
    .zip-form input::placeholder { color: var(--gray); font-weight: 500; }

    .zip-form .btn-go {
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-weight: 700;
      font-size: 15px;
      padding: 0 28px;
      height: 40px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .2s, transform .15s;
      font-family: inherit;
    }
    .zip-form .btn-go:hover  { background: #0070a6; }
    .zip-form .btn-go:active { transform: scale(.95); }

    /* ── Store result cards (hover effect removed) ── */
    .store-result-card {
      background: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    #storeResults::-webkit-scrollbar { width: 4px; }
    #storeResults::-webkit-scrollbar-thumb { background: rgba(255,255,255,.3); border-radius: 4px; }

    /* ── Auto-detect button ── */
    .btn-locate {
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.25);
      color: #fff;
      border-radius: 50px;
      font-weight: 600;
      font-size: 13px;
      padding: 7px 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background .2s;
      font-family: inherit;
      margin-bottom: 16px;
    }
    .btn-locate:hover { background: rgba(255,255,255,0.2); }
    .btn-locate:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── Location status message ── */
    .location-status {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
      min-height: 18px;
    }

    /* ── How-it-works steps ── */
    .how-steps {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      position: relative;
      width: 100%;
      max-width: 360px;
    }

    .how-steps::before {
      content: '';
      position: absolute;
      top: 20px;
      left: calc(50% - 88px);
      right: calc(50% - 88px);
      height: 2px;
      background: rgba(1,46,113,.15);
      z-index: 0;
    }

    .how-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex: 1;
      position: relative;
      z-index: 1;
      background: transparent;
      padding: 0 8px;
    }

    .how-step__circle {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--bg);
      border: 3px solid var(--step-blue);
      color: var(--step-blue);
      font-size: var(--fs-md);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .how-step__label {
      font-size: var(--fs-sm);
      font-weight: 700;
      color: #000;
      text-align: center;
    }
  </style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NMZ4GXJH"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div class="location-page">

  <!-- ══ SECTION 1 – HEADER ══ -->
  <header class="hra-header" style="position:sticky;top:0">
    <img src="HRA logo.png" alt="HRA" style="height:34px;object-fit:contain;margin:0 auto">
  </header>

  <!-- ══ SECTION 2 – MAIN CONTENT ══ -->
  <main class="flex-grow-1 d-flex flex-column align-items-center justify-content-center p-4 p-md-5"
        style="min-height:calc(100vh - 56px)">

    <!-- Location card -->
    <div class="location-card">

      <!-- Pin icon -->
      <div class="pin-wrap">
        <i class="bi bi-geo-alt-fill" style="color:var(--gold);font-size:28px"></i>
      </div>

      <h1 class="fw-bold text-white mb-3" style="font-size:clamp(20px,5vw,28px);line-height:1.2">
        Find deals at HRA stores near you.
      </h1>

      <p class="mb-3" style="color:var(--gray);font-size:14px;font-weight:500;line-height:1.6">
        Enter your zip code to see nearby partner stores.
      </p>

      <!-- Auto-detect location button -->
      <button class="btn-locate" id="btnLocate" onclick="autoDetectLocation()">
        <i class="bi bi-crosshair"></i> Use my location
      </button>

      <!-- Status message for auto-detect -->
      <div class="location-status" id="locationStatus"></div>

      <!-- Zip input -->
      <form class="zip-form" onsubmit="handleZip(event)">
        <input
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="5"
          placeholder="Or enter zip code"
          id="zipInput"
          autocomplete="postal-code"
        >
        <button type="submit" class="btn-go">Go</button>
      </form>

      <!-- Live store results -->
      <div id="storeResults" class="w-100 mt-2 text-start" style="max-height:280px;overflow-y:auto"></div>

      <p class="fw-bold text-uppercase mb-0 mt-3" style="color:var(--gold);font-size:11px;letter-spacing:.14em">
        5,500+ partner stores &middot; Southeast USA
      </p>

    </div>

    <!-- ══ SECTION 3 – HOW IT WORKS ══ -->
    <div class="mt-5 w-100 d-flex justify-content-center px-2">
      <div class="how-steps">

        <div class="how-step">
          <div class="how-step__circle">1</div>
          <span class="how-step__label">Enter zip</span>
        </div>

        <div class="how-step">
          <div class="how-step__circle">2</div>
          <span class="how-step__label">See stores</span>
        </div>

        <div class="how-step">
          <div class="how-step__circle">3</div>
          <span class="how-step__label">Claim deal</span>
        </div>

      </div>
    </div>

  </main>
</div>

<script>
  // ── Go button / form submit ──
  function handleZip(e) {
    if (e) e.preventDefault();
    var zip = document.getElementById('zipInput').value.trim();
    if (zip.length >= 3) {
      window.location.href = 'main.html?zip=' + encodeURIComponent(zip);
    } else {
      document.getElementById('zipInput').focus();
    }
  }

  // ── Live preview while typing ──
  function liveSearch(zip) {
    var resultsBox = document.getElementById('storeResults');
    if (zip.length < 3) { resultsBox.innerHTML = ''; return; }

    var filtered = STORES.filter(function(s) { return s.zip.includes(zip); });

    if (filtered.length === 0) {
      resultsBox.innerHTML =
        '<div class="text-white text-center fw-semibold py-2" style="font-size:13px">No stores found for that zip code.</div>';
      return;
    }

    resultsBox.innerHTML = filtered.slice(0, 1).map(function(s) {
      return '<div class="store-result-card">' +
        '<div>' +
          '<div class="fw-bold" style="color:#012e71;font-size:14px;line-height:1.3">' + s.name + '</div>' +
          '<div style="color:#666;font-size:12px;font-weight:600;margin-top:2px">' + s.city + ', ' + s.state + ' &middot; ' + s.zip + '</div>' +
        '</div>' +
        '<span style="color:#008ed0;font-size:12px;font-weight:700;flex-shrink:0">' + filtered.length + ' Stores Found</span>' +
      '</div>';
    }).join('') +
    (filtered.length > 1
      ? '<div class="text-center fw-bold py-1" style="font-size:13px;color:var(--gold);background:rgba(255,255,255,0.1);border-radius:8px;padding:6px 10px!important">+' + (filtered.length - 1) + ' more stores — press Go to see all</div>'
      : '');
  }

  // ── Auto-detect location using GPS ──
  function autoDetectLocation() {
    var btn = document.getElementById('btnLocate');
    var status = document.getElementById('locationStatus');

    if (!navigator.geolocation) {
      status.style.color = '#ff6b6b';
      status.textContent = 'Geolocation is not supported by your browser.';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Detecting...';
    status.style.color = 'var(--gray)';
    status.textContent = 'Getting your location...';

    navigator.geolocation.getCurrentPosition(
      function(position) {
        var lat = position.coords.latitude;
        var lon = position.coords.longitude;

        // Use free reverse geocoding API to get zip code from coordinates
        fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lon)
          .then(function(res) { return res.json(); })
          .then(function(data) {
            var zip = data.address && (data.address.postcode || '');
            zip = zip.replace(/\D/g, '').substring(0, 5); // keep only digits, max 5

            if (zip && zip.length >= 3) {
              document.getElementById('zipInput').value = zip;
              status.style.color = '#5bc8f5';
              status.textContent = '📍 Location detected: ' + zip;
              liveSearch(zip);
            } else {
              status.style.color = '#ff6b6b';
              status.textContent = 'Could not find zip code. Please enter it manually.';
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-crosshair"></i> Use my location';
          })
          .catch(function() {
            status.style.color = '#ff6b6b';
            status.textContent = 'Could not get zip code. Please enter it manually.';
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-crosshair"></i> Use my location';
          });
      },
      function(error) {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-crosshair"></i> Use my location';
        status.style.color = '#ff6b6b';
        if (error.code === error.PERMISSION_DENIED) {
          status.textContent = 'Location access denied. Please enter zip manually.';
        } else {
          status.textContent = 'Could not detect location. Please enter zip manually.';
        }
      },
      { timeout: 10000 }
    );
  }

  // ── Input listener ──
  document.addEventListener('DOMContentLoaded', function() {
    var input = document.getElementById('zipInput');
    input.addEventListener('input', function() { liveSearch(input.value.trim()); });
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
